  <body>
    <div id="root"></div>
    <script>
      // Pre-boot diagnostics: a failure here happens before React exists, so it
      // must be captured and shown without any framework code.
      (function () {
        window.__ontimeErrors = [];
        var shown = false;
        function errorId() {
          return Math.random().toString(36).slice(2, 8).toUpperCase();
        }
        function showFailure(message) {
          if (shown) return;
          var root = document.getElementById("root");
          if (!root || root.childElementCount > 0) return; // React already mounted
          shown = true;
          var id = errorId();
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#0F172A;color:#fff">' +
            '<div style="max-width:460px;text-align:center">' +
            '<h1 style="font-size:20px;margin:0 0 12px">Ontime.Build could not start</h1>' +
            '<p style="font-size:14px;line-height:1.5;opacity:.8;margin:0 0 8px">' +
            message +
            "</p>" +
            '<p style="font-size:12px;opacity:.6;margin:0 0 20px">Error ID: ' +
            id +
            " &middot; " +
            navigator.userAgent.slice(0, 120) +
            "</p>" +
            '<button onclick="location.reload()" style="background:#F97316;color:#0F172A;border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer">Reload</button>' +
            "</div></div>";
        }
        window.__ontimeShowFailure = showFailure;
        window.addEventListener("error", function (e) {
          window.__ontimeErrors.push(String((e && e.message) || e));
          showFailure(
            "The application could not load in this browser. Please update your browser, or contact support with the error ID below."
          );
        });
        window.addEventListener("unhandledrejection", function (e) {
          window.__ontimeErrors.push(String((e && e.reason) || e));
        });
        // Nothing rendered after 15s => something upstream is blocked.
        setTimeout(function () {
          showFailure(
            "The app did not finish loading. Your network may be blocking part of the Ontime.Build service. Check your connection or contact your network administrator."
          );
        }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
